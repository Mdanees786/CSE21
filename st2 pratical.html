<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>st2 exam </title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f1f1f1;
        }

        .container {
            max-width: 120px;
            margin: 40px auto;
            padding: 15px;
            background: white;
            border: 2px solid black;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform .2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .card h3 {
            margin: 10px 0;
        }

        .price {
            margin-top: 10px;
            font-weight: bold;
            font-size: 18px;
        }

        .price {
            margin-top: 10px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Responsive Product Grid</h2>

        <div class="grid">

            <div class="card">
                <img src="xyz" alt="Product 1">
                <h3>smart phone</h3>
                
                <div class="price">₹500</div>
            </div>

            <div class="card">
                <img src="abcd" alt="Product 2">
                <h3>iphone</h3>
               
                <div class="price">₹5000</div>
            </div>

            <div class="card">
                <img src="efgh" alt="Product 3">
                <h3>apple phone</h3>
                                <div class="price">₹10000</div>
            </div>

            <div class="card">
                <img src="jsdhis" alt="Product 4">                
                <h3>laptop</h3>
               
                <div class="price">₹15000</div>
            </div>

        </div>
    </div>

</body>
</html>
